<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf4e8;--ink:#342820;--gold:#b08428}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}

header{text-align:center;padding:40px 16px 24px}
h1{font-style:italic;font-size:38px}
p.sub{color:var(--gold);letter-spacing:.15em;font-size:13px;margin-top:8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:0 16px 40px;max-width:1100px;margin:0 auto}
.grid a{text-decoration:none;color:var(--ink);text-align:center}
.grid img{width:100%;aspect-ratio:5/7;object-fit:cover;border:3px solid #c49a3e;display:block}
.grid span{display:block;font-style:italic;margin-top:6px}
